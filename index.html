<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blucy Lab</title>
<meta name="description" content="Blucy Lab — 광고 없는 앱을 만드는 1인 개발 스튜디오">
<style>
  :root { --ink:#1f2a2e; --sub:#5b6b70; --line:#e3ece9; --bg:#f7fbfa; --brand:#2f8f7a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
         line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:56px 20px 64px; }
  h1 { font-size:32px; margin:0 0 6px; letter-spacing:-0.5px; }
  .lead { color:var(--sub); margin:0 0 40px; }
  h2 { font-size:15px; color:var(--brand); margin:36px 0 12px; letter-spacing:0.2px; }
  .app { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:12px; }
  .app b { font-size:17px; }
  .app p { margin:4px 0 0; color:var(--sub); font-size:14px; }
  .app a { color:var(--brand); font-size:14px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:0; font-size:14px; }
  dt { color:var(--sub); }
  dd { margin:0; }
  a { color:var(--brand); }
  footer { margin-top:48px; color:var(--sub); font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Blucy Lab</h1>

    <a href="https://blucy21.github.io/todayme/">지원 · 개인정보처리방침</a>
  </div>
  <div class="app">
    <b>세계관창작소</b>
    <p>나만의 세계관을 만들고 정리하는 창작 도구.</p>
  </div>

  <dl>
    <dt>상호</dt><dd>BLUCY LAB (Blucy Lab)</dd>

    <dt>사업자등록번호</dt><dd>468-65-00961</dd>
    <dt>문의</dt><dd><a href="mailto:contact@blucy.kr">contact@blucy.kr</a></dd>
  </dl>

  <footer>© 2026 Blucy Lab</footer>
</main>
</body>
</html>
